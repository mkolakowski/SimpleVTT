# SimpleVTT jail definitions for fail2ban
#
# Wires the SimpleVTT auth filter (filter.d/simplevtt-auth.conf) to
# the actual ban action. Thresholds below use envsubst-style
# ${VAR} placeholders so docker-compose can inject FAIL2BAN_* env
# vars at startup (see Phase 4c of fail2ban-crowdsec-integration.md).
#
# **Docker-compose deploys (Phase 4b+):** the fail2ban service
# mounts this file into /etc/fail2ban/jail.d.template/ (read-only)
# and renders it through `envsubst` via scripts/render-jail.sh
# before fail2ban-server starts. No operator action needed — set
# FAIL2BAN_* values in .env.
#
# **Host-side deploys:** pre-render the placeholders manually before
# copying to /etc/fail2ban/. Example:
#
#     export FAIL2BAN_LOGIN_MAXRETRY=5
#     export FAIL2BAN_LOGIN_FINDTIME=5m
#     export FAIL2BAN_LOGIN_BANTIME=1h
#     export FAIL2BAN_AUDIT_LOG_PATH=/var/log/simplevtt/audit.log
#     envsubst < simplevtt.conf | sudo tee /etc/fail2ban/jail.d/simplevtt.conf
#     sudo fail2ban-client reload
#
# Verify the jail picked up the filter:
#     fail2ban-client status simplevtt-auth

[simplevtt-auth]
enabled  = true
filter   = simplevtt-auth
logpath  = ${FAIL2BAN_AUDIT_LOG_PATH}
maxretry = ${FAIL2BAN_LOGIN_MAXRETRY}
findtime = ${FAIL2BAN_LOGIN_FINDTIME}
bantime  = ${FAIL2BAN_LOGIN_BANTIME}
# v2.472.0 — Phase 4d. Action is env-driven. Default `%(action_)s`
# is fail2ban's built-in iptables/nftables ban. Set
# FAIL2BAN_ACTION=cloudflare-bouncer (Phase 4d) or
# FAIL2BAN_ACTION=ipset-bouncer (Phase 4e) in .env to swap to a
# bouncer-style action. Multiple actions are space-separated.
action   = ${FAIL2BAN_ACTION}

# v2.477.0 — Phase 5 of fail2ban-crowdsec-integration.md.
# Scanner-detection jail. Matches ``api.not_found`` events
# (emitted by app/main.py's 404 handler) and bans IPs that probe
# many missing paths in a short window. Default thresholds:
# 20 distinct 404s in 5 minutes → 6 hour ban. A casual user
# clicking around the site hits 0–3 404s in normal use; a
# vulnerability scanner pumps out hundreds per minute.
[simplevtt-scanner]
enabled  = true
filter   = simplevtt-scanner
logpath  = ${FAIL2BAN_AUDIT_LOG_PATH}
maxretry = ${FAIL2BAN_SCANNER_MAXRETRY}
findtime = ${FAIL2BAN_SCANNER_FINDTIME}
bantime  = ${FAIL2BAN_SCANNER_BANTIME}
# Share the ban-action selector with the auth jail so an operator
# tuning to Cloudflare or ipset gets both jails on the same edge.
action   = ${FAIL2BAN_ACTION}

# v2.481.0 — request-flood jail. Matches ``visitor.request`` events
# (emitted by the opt-in per-request middleware in app/main.py,
# v2.480.0) and bans IPs that fire a high volume of requests in a
# short window — a single IP hammering the app regardless of
# outcome, which the auth + scanner jails miss (those only count
# failed logins / 404s).
#
# **Gated OFF by default** (FAIL2BAN_FLOOD_ENABLED=false). The
# ``visitor.request`` event itself is also OFF by default, so the
# two opt-ins travel together: turn on VISITOR_REQUEST_LOG_ENABLED
# for accounting AND FAIL2BAN_FLOOD_ENABLED for rate-banning as a
# deliberate pair. Default thresholds (when enabled): 300 requests
# in 1 minute → 1 hour ban. A normal page load fires a few dozen
# requests (HTML + assets + polls); 300/min is well above human
# browsing but trips a scripted hammer.
[simplevtt-flood]
enabled  = ${FAIL2BAN_FLOOD_ENABLED}
filter   = simplevtt-flood
logpath  = ${FAIL2BAN_AUDIT_LOG_PATH}
maxretry = ${FAIL2BAN_FLOOD_MAXRETRY}
findtime = ${FAIL2BAN_FLOOD_FINDTIME}
bantime  = ${FAIL2BAN_FLOOD_BANTIME}
# Share the ban-action selector with the other jails.
action   = ${FAIL2BAN_ACTION}
