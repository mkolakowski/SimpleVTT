# SimpleVTT jail definitions for fail2ban
#
# Wires the SimpleVTT auth filter (filter.d/simplevtt-auth.conf) to
# the actual ban action. Defaults below are tuned for a small public
# deployment — adjust the bantime / findtime / maxretry per your
# threat model.
#
# Install:
#     cp simplevtt.conf /etc/fail2ban/jail.d/simplevtt.conf
#     # Edit logpath below to point at your SimpleVTT log source.
#     fail2ban-client reload
#
# The logpath default below assumes you're running SimpleVTT via
# docker-compose and forwarding the stdout-captured container log
# to a host file via a docker logging-driver or systemd-journald
# tail. Adjust to match your setup — common alternatives:
#
#     logpath = /var/log/simplevtt.log              # custom rsyslog rule
#     logpath = /var/lib/docker/containers/<id>/<id>-json.log   # raw
#     backend = systemd                                          # if SimpleVTT runs under systemd
#
# Once installed, verify the jail picked up the filter:
#     fail2ban-client status simplevtt-auth

[simplevtt-auth]
enabled  = true
filter   = simplevtt-auth
logpath  = /var/log/simplevtt/app.log
maxretry = 5
findtime = 5m
bantime  = 1h
# Default action: iptables/nftables ban. Most installations get this
# from /etc/fail2ban/jail.conf's [DEFAULT] action= line; we leave it
# unspecified here so the system default applies.
# action   = %(action_)s
