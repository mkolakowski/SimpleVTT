# v2.472.0 — fail2ban Phase 4d. Cloudflare bouncer ban action.
#
# When fail2ban decides to ban an IP, POSTs it to the Cloudflare
# IP access-rules API with ``mode=block``. Unban does a lookup-by-IP
# then DELETE the matching rule.
#
# Init values come from envsubst on the CLOUDFLARE_* env vars passed
# by docker-compose. Empty values disable the action gracefully —
# curl returns non-zero rather than fail2ban looping on a misconfig.
#
# Opt in by setting in .env:
#     FAIL2BAN_ACTION=cloudflare-bouncer
#     CLOUDFLARE_API_TOKEN=<your token>
#     CLOUDFLARE_ZONE_ID=<your zone id>
#
# Reuses the v2.430.0 cloudflare-edge-banning configuration; same
# token + zone the in-app ban button uses.

[Definition]

# No long-lived state; the actions are stateless POST + DELETE.
actionstart =
actionstop =
actioncheck =

# Ban: POST a new access rule blocking <ip> at the Cloudflare edge.
# We tag the rule's ``notes`` field with the jail name + ban time so
# an operator inspecting Cloudflare's dashboard can trace it back to
# fail2ban without consulting the host logs.
actionban = curl -sS -X POST \
              -H "Authorization: Bearer <cloudflare_api_token>" \
              -H "Content-Type: application/json" \
              -d '{"mode":"block","configuration":{"target":"ip","value":"<ip>"},"notes":"fail2ban <name> banned <ip> for <bantime>s"}' \
              "<cloudflare_api_base_url>/zones/<cloudflare_zone_id>/firewall/access_rules/rules"

# Unban: look up the rule_id matching the IP, then DELETE. We grep
# the rule_id out of the first match with sed (no jq in the image)
# and bail silently if no rule is found (rule may have been deleted
# manually from the Cloudflare dashboard or expired upstream).
actionunban = rule_id=$(curl -sS -X GET \
                -H "Authorization: Bearer <cloudflare_api_token>" \
                "<cloudflare_api_base_url>/zones/<cloudflare_zone_id>/firewall/access_rules/rules?configuration.target=ip&configuration.value=<ip>" \
                | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1) ; \
              if [ -n "$rule_id" ]; then \
                curl -sS -X DELETE \
                  -H "Authorization: Bearer <cloudflare_api_token>" \
                  "<cloudflare_api_base_url>/zones/<cloudflare_zone_id>/firewall/access_rules/rules/$rule_id" ; \
              fi

[Init]
# Rendered at container start by docs/integrations/fail2ban/scripts/
# render-jail.sh from the CLOUDFLARE_* env vars. The fail2ban
# parser sees ALREADY-resolved values here; the ${...} markers
# never reach fail2ban itself.
cloudflare_api_token = ${CLOUDFLARE_API_TOKEN}
cloudflare_zone_id = ${CLOUDFLARE_ZONE_ID}
cloudflare_api_base_url = ${CLOUDFLARE_API_BASE_URL}
