# v2.473.0 — fail2ban Phase 4e. ipset bouncer ban action.
#
# Manages an ipset hash:ip table called `simplevtt-bans` and an
# iptables rule that drops every packet sourced from a member of
# the set. fail2ban's actionban / actionunban just add/remove the
# IP from the set; the iptables rule does the actual dropping.
#
# **This action requires NET_ADMIN on the fail2ban container.**
# Standard --profile fail2ban deploys the container UNPRIVILEGED
# (Phase 4b), so ipset commands fail with EPERM and this action is
# inert. Opt in by layering the
# `docker-compose.fail2ban-ipset.yml` override on top of the main
# compose file:
#
#     docker compose \
#         -f docker-compose.yml \
#         -f docs/integrations/fail2ban/docker-compose.fail2ban-ipset.yml \
#         --profile fail2ban up -d
#
# The override adds `network_mode: host` + `cap_add: [NET_ADMIN]`
# so the container's ipset / iptables commands reach the host's
# network namespace and have a real banning effect.
#
# **Safety notes for the operator:**
# - `network_mode: host` removes container network isolation; the
#   fail2ban process can see + mutate the host's iptables.
# - The actionstart inserts an iptables DROP rule; the actionstop
#   removes it. A killed container leaves the rule installed — the
#   ipset persists between restarts (timeout 0 below = ipset entry
#   timeout is set per-add).
# - For shared-tenancy or strict-isolation hosts, prefer
#   `FAIL2BAN_ACTION=cloudflare-bouncer` (Phase 4d) instead.
#
# Opt in by setting in .env (after layering the override):
#     FAIL2BAN_ACTION=ipset-bouncer

[Definition]

# Create the ipset and the iptables rule that drops from it.
# `-exist` keeps actionstart idempotent across container restarts.
actionstart = ipset create -exist simplevtt-bans hash:ip timeout 0
              iptables -C INPUT -m set --match-set simplevtt-bans src -j DROP || \
                iptables -I INPUT -m set --match-set simplevtt-bans src -j DROP

# Idempotent teardown — remove the iptables rule then destroy the
# set. We ignore errors so a half-state container can restart
# cleanly.
actionstop = iptables -D INPUT -m set --match-set simplevtt-bans src -j DROP 2>/dev/null || true
             ipset destroy simplevtt-bans 2>/dev/null || true

actioncheck =

# Add / remove an IP. fail2ban substitutes <ip> and <bantime>
# (seconds) at action-fire time. Timeout = 0 = no per-entry
# expiration; rely on fail2ban's own ban-list bookkeeping to call
# actionunban at the right time.
actionban = ipset add -exist simplevtt-bans <ip> timeout <bantime>
actionunban = ipset del -exist simplevtt-bans <ip>

[Init]
# No env-driven init for this action — the ipset name is hardcoded
# (operator-tunable values would clutter the .env file with knobs
# nobody flips in practice).
