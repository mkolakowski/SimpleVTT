# v2.566.0 — optional Discord webhook notification action.
#
# Posts a short message to a Discord channel on every ban + unban so an
# operator gets a live feed of fail2ban activity. This is a NOTIFY-ONLY
# action — it does not ban anything itself; pair it with a real ban
# action (the built-in iptables, cloudflare-bouncer, or ipset-bouncer).
#
# Opt in by ADDING it to FAIL2BAN_ACTION (space-separated — fail2ban
# runs every listed action per ban) and setting the webhook URL in .env:
#
#     FAIL2BAN_DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/…
#     FAIL2BAN_ACTION=cloudflare-bouncer discord-notify
#     # or, with the default iptables ban + a Discord ping:
#     FAIL2BAN_ACTION=%(action_)s discord-notify
#
# The webhook URL comes from envsubst on FAIL2BAN_DISCORD_WEBHOOK_URL
# (resolved by scripts/render-jail.sh at container start). If it's
# EMPTY the action no-ops gracefully — the `[ -n "<webhook_url>" ]`
# guard skips the curl, so leaving discord-notify in FAIL2BAN_ACTION
# without a URL set is harmless. ``|| true`` + ``-m 10`` ensure a slow
# or failing webhook never blocks or fails the ban itself (the ban
# action is independent).
#
# Create the webhook in Discord: Server Settings → Integrations →
# Webhooks → New Webhook → Copy Webhook URL. Anyone with the URL can
# post to that channel, so treat it like a secret (keep it in .env,
# never commit it).

[Definition]

# No long-lived state; each ban/unban is a one-shot POST.
actionstart =
actionstop =
actioncheck =

# Ban: POST a message naming the IP, jail, failure count, and ban time.
actionban = if [ -n "<webhook_url>" ]; then \
              curl -sS -m 10 -H "Content-Type: application/json" \
                -d '{"username":"<username>","content":":hammer: fail2ban **banned** `<ip>` - jail `<name>`, <failures> failure(s), bantime <bantime>s"}' \
                "<webhook_url>" >/dev/null 2>&1 || true ; \
            fi

# Unban: POST a follow-up when the ban expires (or is lifted).
actionunban = if [ -n "<webhook_url>" ]; then \
                curl -sS -m 10 -H "Content-Type: application/json" \
                  -d '{"username":"<username>","content":":white_check_mark: fail2ban **unbanned** `<ip>` - jail `<name>`"}' \
                  "<webhook_url>" >/dev/null 2>&1 || true ; \
              fi

[Init]
# Rendered at container start by docs/integrations/fail2ban/scripts/
# render-jail.sh from the FAIL2BAN_DISCORD_* env vars — fail2ban sees
# already-resolved values; the ${...} markers never reach it.
webhook_url = ${FAIL2BAN_DISCORD_WEBHOOK_URL}
username = ${FAIL2BAN_DISCORD_USERNAME}
