# SimpleVTT authentication filter for fail2ban
#
# Matches canonical audit-log lines emitted by app/audit_log.py for the
# auth.* event family. See docs/plans/fail2ban-crowdsec-integration.md
# for the parser-regex contract this filter shares with the CrowdSec
# parser pipeline.
#
# Install:
#     cp simplevtt-auth.conf /etc/fail2ban/filter.d/simplevtt-auth.conf
#     fail2ban-client reload
#
# Test against a sample log (replace LOG_PATH with the SimpleVTT log
# tail — typically docker-compose's app-service stdout captured by the
# host journal):
#     fail2ban-regex LOG_PATH /etc/fail2ban/filter.d/simplevtt-auth.conf
#
# Tuning: the jail in jail.d/simplevtt.conf wraps this filter with the
# bantime / findtime / maxretry knobs. This file just defines what
# counts as a "failed auth" event for the matcher.

[Definition]

# Canonical audit-log line shape:
#     <ts> <level> auth.<event> ip=<HOST> ua="..." [...]
#
# The <HOST> tag is fail2ban's standard placeholder for "extract IP
# here." We anchor on the literal "auth.login_failed" or
# "auth.signup_failed" event tag so successful logins don't get
# matched. The signup_failed line is filtered out at jail-config
# time if signups aren't enabled on the deploy.

failregex = ^.+ (?:WARNING|ERROR) [\w.]*audit[\w.]*: auth\.(?:login_failed|signup_failed) ip=<HOST>\b
            ^.+ auth\.(?:login_failed|signup_failed) ip=<HOST>\b
            ^.+ (?:WARNING|ERROR) [\w.]*audit[\w.]*: api\.(?:unauthorized|forbidden) ip=<HOST>\b
            ^.+ api\.(?:unauthorized|forbidden) ip=<HOST>\b
            ^.+ (?:WARNING|ERROR) [\w.]*audit[\w.]*: demo_magic_link\.verify_rejected ip=<HOST>\b
            ^.+ demo_magic_link\.verify_rejected ip=<HOST>\b

# What does NOT count as a failure — explicit ignore so a log entry
# that mentions "login_failed" inside a UA string can't be confused
# for an event tag (defense in depth; the anchor above already
# constrains the match). Also ignore the success-path events from
# the same families so a legitimate user retrying a forgotten
# password doesn't trip the jail after the next correct attempt.
ignoreregex = ^.+ auth\.login_ok\b
              ^.+ demo_magic_link\.(?:mint_ok|verify_ok)\b

# fail2ban's date-pattern parser handles the standard %(asctime)s
# Python log format (2026-06-18 14:23:45,123). No override needed.
