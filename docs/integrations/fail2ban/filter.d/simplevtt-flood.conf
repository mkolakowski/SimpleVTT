# SimpleVTT request-flood filter for fail2ban
#
# v2.481.0 — matches the canonical ``visitor.request`` audit-log
# event emitted by the opt-in per-request middleware in
# ``app/main.py`` (v2.480.0). The companion jail
# ``[simplevtt-flood]`` in ``jail.d/simplevtt.conf`` bans IPs that
# fire a high volume of requests in a short window — a single IP
# hammering the app irrespective of outcome (success OR error),
# which the auth + scanner jails miss because those only count
# failed logins / 404s.
#
# **Only fires when per-request logging is on.** The
# ``visitor.request`` event is DEFAULT OFF (see
# ``app/visitor_log.py``); it requires
# ``VISITOR_REQUEST_LOG_ENABLED=true`` + ``TRUSTED_PROXY_HOPS>=1``.
# Without those, no ``visitor.request`` lines exist and this filter
# matches nothing. The companion jail is likewise gated OFF by
# default (``FAIL2BAN_FLOOD_ENABLED=false``) so the two opt-ins
# travel together — turn on visitor logging for accounting AND the
# flood jail for rate-banning as a deliberate pair.
#
# Install (host-side):
#     cp simplevtt-flood.conf /etc/fail2ban/filter.d/simplevtt-flood.conf
#     fail2ban-client reload
#
# Test against a sample log (replace LOG_PATH):
#     fail2ban-regex LOG_PATH /etc/fail2ban/filter.d/simplevtt-flood.conf
#
# Docker-compose deploys: the file is mounted into the fail2ban
# container automatically via the v2.470.0 filter.d bind mount;
# no operator action needed beyond bringing up
# ``--profile fail2ban``.

[Definition]

# Canonical audit-log line shape:
#     <ts> <level> visitor.request ip=<HOST> ua="..." method=GET path="..." status=200 ms=12
#
# The <HOST> tag is fail2ban's standard placeholder for the IP we
# want to ban. We match both the "audit logger prefix" variant
# (`INFO simplevtt.audit:`) and the bare-event variant so the
# regex is robust across logger format tweaks. Every request emits
# one line regardless of status, so the jail's maxretry is a raw
# request-rate ceiling, not an error count.
failregex = ^.+ (?:INFO|WARNING|ERROR) [\w.]*audit[\w.]*: visitor\.request ip=<HOST>\b
            ^.+ visitor\.request ip=<HOST>\b

