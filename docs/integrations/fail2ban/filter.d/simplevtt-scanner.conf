# SimpleVTT scanner-detection filter for fail2ban
#
# v2.477.0 — matches the canonical ``api.not_found`` audit-log
# event emitted by ``app/main.py``'s 404 handler. The companion
# jail ``[simplevtt-scanner]`` in ``jail.d/simplevtt.conf`` bans
# IPs that probe many missing paths in a short window (default:
# 20 distinct 404s in 5 min → 6 h ban).
#
# This filter is intentionally separate from ``simplevtt-auth.conf``
# so the 404-probing threshold can be tuned independently of the
# credential-stuffing + magic-link + API-401/403 thresholds — 404
# noise from broken links has a different floor than failed
# logins.
#
# Install (host-side):
#     cp simplevtt-scanner.conf /etc/fail2ban/filter.d/simplevtt-scanner.conf
#     fail2ban-client reload
#
# Test against a sample log (replace LOG_PATH):
#     fail2ban-regex LOG_PATH /etc/fail2ban/filter.d/simplevtt-scanner.conf
#
# Docker-compose deploys: the file is mounted into the fail2ban
# container automatically via the v2.470.0 filter.d bind mount;
# no operator action needed beyond bringing up
# ``--profile fail2ban``.

[Definition]

# Canonical audit-log line shape:
#     <ts> <level> api.not_found ip=<HOST> ua="..." path="..."
#
# The <HOST> tag is fail2ban's standard placeholder for the IP we
# want to ban. We match both the "audit logger prefix" variant
# (`WARNING simplevtt.audit:`) and the bare-event variant so the
# regex is robust across logger format tweaks.
failregex = ^.+ (?:WARNING|ERROR) [\w.]*audit[\w.]*: api\.not_found ip=<HOST>\b
            ^.+ api\.not_found ip=<HOST>\b

# Don't count the path-aware variants the audit log emits today.
# A future ship may add ``api.not_found_static`` for static asset
# 404s (browser noise) — this ignore block reserves the slot.
ignoreregex = ^.+ api\.not_found_static\b

# fail2ban's date-pattern parser handles the standard
# ``%(asctime)s`` Python log format. No override needed.
