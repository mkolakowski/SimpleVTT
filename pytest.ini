[pytest]
asyncio_mode = auto
# Function-scoped fixtures + tests is the safe default — keeps every
# test's httpx client + WS connection on the same event loop. Session-
# scoped client sharing would cut ~1-2 s off a full suite run but
# trips "Future attached to a different loop" errors under
# pytest-asyncio 0.24 because the tests still default to function-
# scope loops. Phase 1.5 may revisit if suite runtime becomes a
# bottleneck.
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Phase 1 of the test harness: see docs/plans/test-harness.md.
# Run with: pytest tests/harness/ (the harness invokes the demo stack
# at HARNESS_BASE_URL, defaulting to http://localhost:8013).
