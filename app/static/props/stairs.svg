<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Top-down staircase: stepped treads shading downward. Original art. -->
  <rect x="20" y="14" width="60" height="72" rx="3" fill="#6b6f75" stroke="#3a3d42" stroke-width="3"/>
  <rect x="20" y="14" width="60" height="12" fill="#c7cbd1"/>
  <rect x="20" y="26" width="60" height="12" fill="#b0b4ba"/>
  <rect x="20" y="38" width="60" height="12" fill="#9a9ea4"/>
  <rect x="20" y="50" width="60" height="12" fill="#82868c"/>
  <rect x="20" y="62" width="60" height="12" fill="#6b6f75"/>
  <rect x="20" y="74" width="60" height="12" fill="#54585e"/>
  <g stroke="#3a3d42" stroke-width="1.5">
    <line x1="20" y1="26" x2="80" y2="26"/><line x1="20" y1="38" x2="80" y2="38"/>
    <line x1="20" y1="50" x2="80" y2="50"/><line x1="20" y1="62" x2="80" y2="62"/>
    <line x1="20" y1="74" x2="80" y2="74"/>
  </g>
</svg>
