  <rect x="26" y="30" width="48" height="40" rx="4" fill="#8a5a2b" stroke="#3a2510" stroke-width="2" transform="rotate(-8 50 50)"/>
  <g transform="rotate(-8 50 50)">
    <rect x="28" y="34" width="20" height="32" fill="#f2eede" stroke="#c9c2ad" stroke-width="1.5"/>
    <rect x="52" y="34" width="20" height="32" fill="#f2eede" stroke="#c9c2ad" stroke-width="1.5"/>
    <line x1="50" y1="34" x2="50" y2="66" stroke="#8a8570" stroke-width="2"/>
    <g stroke="#b6ae94" stroke-width="1">
      <line x1="31" y1="40" x2="45" y2="40"/><line x1="31" y1="46" x2="45" y2="46"/><line x1="31" y1="52" x2="45" y2="52"/>
      <line x1="55" y1="40" x2="69" y2="40"/><line x1="55" y1="46" x2="69" y2="46"/><line x1="55" y1="52" x2="69" y2="52"/>
    </g>
  </g>
