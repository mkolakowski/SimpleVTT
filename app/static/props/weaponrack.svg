<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Top-down weapon rack: wooden rack with a sword, spear, axe. Original art. -->
  <rect x="14" y="30" width="72" height="40" rx="3" fill="#6f4a24" stroke="#2e1c0d" stroke-width="3"/>
  <rect x="14" y="30" width="72" height="10" fill="#5c3a1c"/>
  <!-- sword -->
  <line x1="30" y1="40" x2="30" y2="68" stroke="#c9ccd2" stroke-width="4"/>
  <line x1="24" y1="46" x2="36" y2="46" stroke="#8a6a1c" stroke-width="3"/>
  <!-- spear -->
  <line x1="50" y1="38" x2="50" y2="70" stroke="#8a5a2b" stroke-width="3"/>
  <path d="M50 36 l4 8 h-8 Z" fill="#c9ccd2"/>
  <!-- axe -->
  <line x1="70" y1="40" x2="70" y2="68" stroke="#8a5a2b" stroke-width="3"/>
  <path d="M70 44 q10 2 8 12 q-8 -2 -8 -12Z" fill="#c9ccd2" stroke="#6b6f75" stroke-width="1.5"/>
</svg>
