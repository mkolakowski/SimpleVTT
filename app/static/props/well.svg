  <g fill="none" stroke="#6b6f75" stroke-width="2">
    <circle cx="50" cy="50" r="40"/>
    <line x1="50" y1="10" x2="50" y2="26"/><line x1="78" y1="22" x2="66" y2="34"/>
    <line x1="90" y1="50" x2="74" y2="50"/><line x1="78" y1="78" x2="66" y2="66"/>
    <line x1="50" y1="90" x2="50" y2="74"/><line x1="22" y1="78" x2="34" y2="66"/>
    <line x1="10" y1="50" x2="26" y2="50"/><line x1="22" y1="22" x2="34" y2="34"/>
  </g>
  <circle cx="50" cy="50" r="24" fill="#274a5c"/>
  <circle cx="50" cy="50" r="24" fill="none" stroke="#1a3140" stroke-width="3"/>
