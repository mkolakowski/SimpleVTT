  <rect x="20" y="20" width="60" height="60" fill="#b07d40"/>
  <g stroke="#6b431f" stroke-width="3">
    <line x1="20" y1="40" x2="80" y2="40"/>
    <line x1="20" y1="60" x2="80" y2="60"/>
    <line x1="20" y1="20" x2="80" y2="80"/>
    <line x1="80" y1="20" x2="20" y2="80"/>
  </g>
</svg>
