<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Top-down portcullis: iron grate in a stone channel. Original art. -->
  <rect x="10" y="40" width="80" height="20" fill="#8f9299" stroke="#4b4f55" stroke-width="3"/>
  <g stroke="#3a3d42" stroke-width="4">
    <line x1="20" y1="40" x2="20" y2="60"/><line x1="32" y1="40" x2="32" y2="60"/>
    <line x1="44" y1="40" x2="44" y2="60"/><line x1="56" y1="40" x2="56" y2="60"/>
    <line x1="68" y1="40" x2="68" y2="60"/><line x1="80" y1="40" x2="80" y2="60"/>
  </g>
  <g stroke="#3a3d42" stroke-width="3">
    <line x1="12" y1="46" x2="88" y2="46"/><line x1="12" y1="54" x2="88" y2="54"/>
  </g>
  <g fill="#6b6f75">
    <circle cx="20" cy="46" r="2"/><circle cx="44" cy="46" r="2"/><circle cx="68" cy="46" r="2"/>
    <circle cx="32" cy="54" r="2"/><circle cx="56" cy="54" r="2"/><circle cx="80" cy="54" r="2"/>
  </g>
</svg>
