    <line x1="50" y1="16" x2="50" y2="84"/><line x1="16" y1="50" x2="84" y2="50"/>
    <line x1="26" y1="26" x2="74" y2="74"/><line x1="74" y1="26" x2="26" y2="74"/>
  </g>
  <circle cx="50" cy="50" r="34" fill="none" stroke="#7a7d83" stroke-width="3"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#7a7d83" stroke-width="2"/>
