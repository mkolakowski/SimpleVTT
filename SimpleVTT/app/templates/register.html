{% extends "base.html" %}
{% block title %}Register — SimpleVTT{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Create account</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/register" class="stacked">
        <label>Display name <input type="text" name="display_name" required></label>
        <label>Email <input type="email" name="email" autocomplete="username" required></label>
        <label>Password (min 8 chars) <input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
        <button type="submit">Register</button>
    </form>
    <p class="muted"><a href="/login">Back to sign in</a></p>
</div>
{% endblock %}
