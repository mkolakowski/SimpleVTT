name: Docker Image CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # mkolakowski/simplevtt (lowercased by GHCR)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - uses: actions/checkout@v4

      # Read the version straight from version.py so the image tag always
      # matches what the app reports at /version. Only used on main.
      - name: Read app version
        id: ver
        run: |
          VERSION=$(python3 -c "
          import re, pathlib
          m = re.search(r'APP_VERSION\s*=\s*\"(.+?)\"',
                        pathlib.Path('app/version.py').read_text())
          print(m.group(1))
          ")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      # QEMU lets Buildx cross-compile arm64 on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in on real pushes — not on PR builds.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Smart tagging:
      #   main  → :latest, :<version> (e.g. :0.20.0), :sha-<short>
      #   dev   → :dev, :sha-<short>
      #   PR    → :sha-<short>  (built but never pushed)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.ver.outputs.value }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Push only on real branch pushes; PRs just verify the build
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
