name: Test harness

# Phase 2 of the click-through test harness (see
# docs/plans/test-harness.md). Boots the docker compose stack with
# DEMO_MODE=true (so the demo PCs + the Tavern Brawl encounter are
# pre-seeded — the test fixtures depend on them), waits for /healthz,
# runs pytest against the running stack, and uploads JUnit XML + HTML
# reports as artifacts. Fails the workflow on any test failure.

# v2.158.95 — Test-harness CI auto-trigger disabled per project owner
# request. Workflow now only runs when manually fired from the Actions
# tab (workflow_dispatch). Re-enable by restoring the push: + pull_request:
# entries below.
on:
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Compose needs a .env. We write a minimal one for CI:
      #   - DEMO_MODE=true ships the seed PCs the tests rely on
      #     (Pip / Thalindra / Tavik, the demo accounts).
      #   - DEMO_RESET_ON_BOOT=true forces a fresh seed at startup so
      #     stale state from a prior cached image can't poison the run.
      #   - APP_SECRET_KEY is deterministic for the CI run; never used
      #     to sign anything that leaves the runner.
      - name: Write CI .env
        run: |
          cat > .env <<'EOF'
          APP_PORT=8013
          APP_SECRET_KEY=ci-deterministic-not-a-real-secret-${{ github.run_id }}
          APP_BASE_URL=http://localhost:8013
          APP_ALLOW_LOCAL_REGISTRATION=true
          ADMINS=demo-gm@example.com
          CHARACTER_TEMPLATES=generic,dnd5e
          APP_DEFAULT_THEME=sepia
          GOOGLE_SSO_ENABLED=false
          GOOGLE_SSO_CLIENT_ID=
          GOOGLE_SSO_CLIENT_SECRET=
          POSTGRES_USER=simplevtt
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DB=simplevtt
          BACKUP_CRON=0 3 * * *
          KEEP_DAILY=7
          KEEP_WEEKLY=4
          DEMO_MODE=true
          DEMO_RESET_INTERVAL_MINUTES=60
          DEMO_RESET_ON_BOOT=true
          DEMO_CREDENTIALS_VISIBLE=true
          # v2.49.12: TEST_MODE mounts /api/test/dice/seed so the
          # dice-seeding harness test can flip the RNG deterministic
          # mid-run. Stays off outside CI.
          TEST_MODE=true
          EOF

      - name: Build and start stack
        run: docker compose up -d --build

      # The app's startup runs the inline schema migrations + the demo
      # seeder (DEMO_RESET_ON_BOOT=true). On a cold runner that's ~10-30 s.
      # Poll /healthz until it returns 200 or 90 s elapse — the build
      # itself can be slow on a fresh image, so we're generous here.
      - name: Wait for /healthz
        run: |
          for i in {1..45}; do
            if curl -fs http://localhost:8013/healthz > /dev/null; then
              echo "Stack healthy after ~$((i*2))s"
              curl -s http://localhost:8013/version
              exit 0
            fi
            echo "Waiting for stack... ($i/45)"
            sleep 2
          done
          echo "Stack didn't become healthy in 90s. Dumping logs."
          docker compose logs app | tail -100
          exit 1

      # The demo seed runs on app startup; verify the demo PCs landed
      # in the roster before pytest fires. If this is empty we'd waste
      # 10 s of test runtime failing every test on the same root cause.
      - name: Sanity-check demo seed
        run: |
          curl -s -c /tmp/cookies.txt -X POST http://localhost:8013/login \
            -d "email=demo-gm@example.com&password=demopass" \
            -L > /dev/null
          ROSTER=$(curl -s -b /tmp/cookies.txt http://localhost:8013/api/campaign/1/roster)
          echo "Roster: $ROSTER"
          echo "$ROSTER" | grep -q "Pip Quickfingers" || { echo "Demo seed missing Pip"; exit 1; }
          echo "$ROSTER" | grep -q "Thalindra Moonwhisper" || { echo "Demo seed missing Thalindra"; exit 1; }
          echo "$ROSTER" | grep -q "Brother Tavik Stonebrow" || { echo "Demo seed missing Tavik"; exit 1; }
          echo "$ROSTER" | grep -q "Sir Caelan Lightbringer" || { echo "Demo seed missing Caelan"; exit 1; }
          echo "$ROSTER" | grep -q "Lyra Sunstrider" || { echo "Demo seed missing Lyra"; exit 1; }
          echo "$ROSTER" | grep -q "Mira Greenleaf" || { echo "Demo seed missing Mira"; exit 1; }
          echo "$ROSTER" | grep -q "Garrik Ironside" || { echo "Demo seed missing Garrik"; exit 1; }
          echo "$ROSTER" | grep -q "Kael Brightleaf" || { echo "Demo seed missing Kael"; exit 1; }
          echo "$ROSTER" | grep -q "Zara Emberfire" || { echo "Demo seed missing Zara"; exit 1; }
          echo "$ROSTER" | grep -q "Krieger Stonefist" || { echo "Demo seed missing Krieger"; exit 1; }
          echo "$ROSTER" | grep -q "Rowan Quickbow" || { echo "Demo seed missing Rowan"; exit 1; }
          echo "$ROSTER" | grep -q "Magnus Hexbinder" || { echo "Demo seed missing Magnus"; exit 1; }

      - name: Run test harness
        run: |
          mkdir -p reports
          pytest tests/harness/ \
            --junitxml=reports/harness.xml \
            --html=reports/harness.html \
            --self-contained-html \
            -v

      # Upload reports regardless of pass/fail so a green run still
      # produces a downloadable HTML report; on failure the artifact
      # is the primary triage surface.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-harness-reports
          path: reports/
          retention-days: 14

      # Capture server logs on failure so the contributor can debug
      # without re-running the workflow.
      - name: Dump server logs on failure
        if: failure()
        run: docker compose logs app | tail -200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Phase 4.5 (v2.13.1): Playwright UI-layer harness. Runs in parallel
  # with the harness job above so total wall-clock stays flat;
  # independent stack boot so the two jobs don't fight over ports.
  # The chromium binary is cached between runs (~250MB; cache key
  # tied to requirements-dev.txt + the runner OS so a deps bump
  # invalidates correctly).
  harness-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Playwright caches its browser binaries under ~/.cache/ms-playwright.
      # Caching saves the ~250MB chromium download on cache-hit runs (CI
      # speedup: ~30-45s → ~5s for the install step).
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Playwright chromium + system deps
        # ``--with-deps`` installs the apt packages chromium needs
        # (fonts, libnss, etc.). On cache hit the binary is already
        # there; --with-deps still installs the system packages (those
        # aren't cached because they're outside ~/.cache).
        run: playwright install --with-deps chromium

      - name: Write CI .env
        run: |
          cat > .env <<'EOF'
          APP_PORT=8013
          APP_SECRET_KEY=ci-deterministic-not-a-real-secret-ui-${{ github.run_id }}
          APP_BASE_URL=http://localhost:8013
          APP_ALLOW_LOCAL_REGISTRATION=true
          ADMINS=demo-gm@example.com
          CHARACTER_TEMPLATES=generic,dnd5e
          APP_DEFAULT_THEME=sepia
          GOOGLE_SSO_ENABLED=false
          GOOGLE_SSO_CLIENT_ID=
          GOOGLE_SSO_CLIENT_SECRET=
          POSTGRES_USER=simplevtt
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DB=simplevtt
          BACKUP_CRON=0 3 * * *
          KEEP_DAILY=7
          KEEP_WEEKLY=4
          DEMO_MODE=true
          DEMO_RESET_INTERVAL_MINUTES=60
          DEMO_RESET_ON_BOOT=true
          DEMO_CREDENTIALS_VISIBLE=true
          EOF

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for /healthz
        run: |
          for i in {1..45}; do
            if curl -fs http://localhost:8013/healthz > /dev/null; then
              echo "Stack healthy after ~$((i*2))s"
              exit 0
            fi
            echo "Waiting for stack... ($i/45)"
            sleep 2
          done
          echo "Stack didn't become healthy in 90s. Dumping logs."
          docker compose logs app | tail -100
          exit 1

      - name: Sanity-check demo seed
        run: |
          curl -s -c /tmp/cookies.txt -X POST http://localhost:8013/login \
            -d "email=demo-gm@example.com&password=demopass" \
            -L > /dev/null
          ROSTER=$(curl -s -b /tmp/cookies.txt http://localhost:8013/api/campaign/1/roster)
          echo "Roster: $ROSTER"
          echo "$ROSTER" | grep -q "Pip Quickfingers" || { echo "Demo seed missing Pip"; exit 1; }
          echo "$ROSTER" | grep -q "Brother Tavik Stonebrow" || { echo "Demo seed missing Tavik"; exit 1; }
          echo "$ROSTER" | grep -q "Sir Caelan Lightbringer" || { echo "Demo seed missing Caelan"; exit 1; }
          echo "$ROSTER" | grep -q "Lyra Sunstrider" || { echo "Demo seed missing Lyra"; exit 1; }
          echo "$ROSTER" | grep -q "Mira Greenleaf" || { echo "Demo seed missing Mira"; exit 1; }
          echo "$ROSTER" | grep -q "Garrik Ironside" || { echo "Demo seed missing Garrik"; exit 1; }
          echo "$ROSTER" | grep -q "Kael Brightleaf" || { echo "Demo seed missing Kael"; exit 1; }
          echo "$ROSTER" | grep -q "Zara Emberfire" || { echo "Demo seed missing Zara"; exit 1; }
          echo "$ROSTER" | grep -q "Krieger Stonefist" || { echo "Demo seed missing Krieger"; exit 1; }
          echo "$ROSTER" | grep -q "Rowan Quickbow" || { echo "Demo seed missing Rowan"; exit 1; }
          echo "$ROSTER" | grep -q "Magnus Hexbinder" || { echo "Demo seed missing Magnus"; exit 1; }

      - name: Run Playwright harness
        run: |
          mkdir -p reports
          pytest tests/harness_ui/ \
            --junitxml=reports/harness-ui.xml \
            --html=reports/harness-ui.html \
            --self-contained-html \
            -v

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-harness-ui-reports
          path: reports/
          retention-days: 14

      - name: Dump server logs on failure
        if: failure()
        run: docker compose logs app | tail -200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # v2.49.17 — encounter-simulation suite, Level 1 (smoke).
  # See docs/plans/encounter-sim-test-suite.md. Phase 1 commits A/B/C
  # landed dice seeding, the directory skeleton, and the 3 PoC tests
  # (test_garrik_strike / test_tavik_sacred_flame / test_thalindra_
  # fireball). ``continue-on-error: true`` per the plan's Phase 1 task
  # 6 — flip to ``false`` once Phase 1 reaches the "5 consecutive runs
  # without a flake" exit criterion (Garrik already hits this; Tavik
  # and Thalindra need CI corroboration before locking the gate).
  #
  # TEST_MODE=true is mandatory here (the suite calls
  # ``/api/test/dice/seed`` for deterministic rolls). The harness job
  # above already sets it; this job mirrors that .env for the same
  # reason.
  encounter-sim:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Playwright chromium + system deps
        run: playwright install --with-deps chromium

      - name: Write CI .env
        run: |
          cat > .env <<'EOF'
          APP_PORT=8013
          APP_SECRET_KEY=ci-deterministic-not-a-real-secret-encsim-${{ github.run_id }}
          APP_BASE_URL=http://localhost:8013
          APP_ALLOW_LOCAL_REGISTRATION=true
          ADMINS=demo-gm@example.com
          CHARACTER_TEMPLATES=generic,dnd5e
          APP_DEFAULT_THEME=sepia
          GOOGLE_SSO_ENABLED=false
          GOOGLE_SSO_CLIENT_ID=
          GOOGLE_SSO_CLIENT_SECRET=
          POSTGRES_USER=simplevtt
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DB=simplevtt
          BACKUP_CRON=0 3 * * *
          KEEP_DAILY=7
          KEEP_WEEKLY=4
          DEMO_MODE=true
          DEMO_RESET_INTERVAL_MINUTES=60
          DEMO_RESET_ON_BOOT=true
          DEMO_CREDENTIALS_VISIBLE=true
          TEST_MODE=true
          EOF

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for /healthz
        run: |
          for i in {1..45}; do
            if curl -fs http://localhost:8013/healthz > /dev/null; then
              echo "Stack healthy after ~$((i*2))s"
              exit 0
            fi
            echo "Waiting for stack... ($i/45)"
            sleep 2
          done
          echo "Stack didn't become healthy in 90s. Dumping logs."
          docker compose logs app | tail -100
          exit 1

      - name: Sanity-check demo seed
        run: |
          curl -s -c /tmp/cookies.txt -X POST http://localhost:8013/login \
            -d "email=demo-gm@example.com&password=demopass" -L > /dev/null
          ROSTER=$(curl -s -b /tmp/cookies.txt http://localhost:8013/api/campaign/1/roster)
          echo "$ROSTER" | grep -q "Garrik Ironside" || { echo "missing Garrik"; exit 1; }
          echo "$ROSTER" | grep -q "Brother Tavik Stonebrow" || { echo "missing Tavik"; exit 1; }
          echo "$ROSTER" | grep -q "Thalindra Moonwhisper" || { echo "missing Thalindra"; exit 1; }

      - name: Sanity-check TEST_MODE endpoint
        run: |
          # ``/api/test/dice/seed`` only mounts when TEST_MODE=true. Fail
          # early if it 404s so a misconfigured .env doesn't cause every
          # encounter-sim test to fail with a confusing "endpoint missing".
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            http://localhost:8013/api/test/dice/seed \
            -H "Content-Type: application/json" -d '{"seed":0}')
          if [ "$STATUS" != "200" ]; then
            echo "TEST_MODE endpoint returned $STATUS (expected 200) — is TEST_MODE=true in .env?"
            exit 1
          fi

      - name: Run encounter-sim Level 1 + Level 2 + Level 3
        run: |
          mkdir -p reports
          pytest tests/encounter_sim/level_1_smoke/ \
                 tests/encounter_sim/level_2_encounter/ \
                 tests/encounter_sim/level_3_edge_cases/ \
            --junitxml=reports/encounter-sim.xml \
            --html=reports/encounter-sim.html \
            --self-contained-html \
            -v

      - name: Upload encounter-sim reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: encounter-sim-reports
          path: reports/
          retention-days: 14

      - name: Dump server logs on failure
        if: failure()
        run: docker compose logs app | tail -200

      - name: Tear down
        if: always()
        run: docker compose down -v
