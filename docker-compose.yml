# SimpleVTT — docker compose stack
# All images chosen are multi-arch (linux/amd64 + linux/arm64).
# All configuration comes from .env (see .env.example).
#
# CONVENTION: third-party APIs are added here as named services so they stay
# on the internal Docker network and never depend on internet availability at
# request time. See CLAUDE.md for the full rule.
services:
  # ── Database ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: simplevtt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simplevtt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplevtt}
      POSTGRES_DB: ${POSTGRES_DB:-simplevtt}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simplevtt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: simplevtt-app:latest
    container_name: simplevtt-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-simplevtt}:${POSTGRES_PASSWORD:-simplevtt}@db:5432/${POSTGRES_DB:-simplevtt}
      APP_PORT: ${APP_PORT:-8013}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8013}
      APP_ALLOW_LOCAL_REGISTRATION: ${APP_ALLOW_LOCAL_REGISTRATION:-true}
      ADMINS: ${ADMINS:-}
      CHARACTER_TEMPLATES: ${CHARACTER_TEMPLATES:-generic,dnd5e}
      APP_DEFAULT_THEME: ${APP_DEFAULT_THEME:-sepia}
      GOOGLE_SSO_ENABLED: ${GOOGLE_SSO_ENABLED:-false}
      GOOGLE_SSO_CLIENT_ID: ${GOOGLE_SSO_CLIENT_ID:-}
      GOOGLE_SSO_CLIENT_SECRET: ${GOOGLE_SSO_CLIENT_SECRET:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_RESET_INTERVAL_MINUTES: ${DEMO_RESET_INTERVAL_MINUTES:-60}
      DEMO_RESET_ON_BOOT: ${DEMO_RESET_ON_BOOT:-true}
      DEMO_CREDENTIALS_VISIBLE: ${DEMO_CREDENTIALS_VISIBLE:-true}
      # v2.425.0 — demo magic-link login plan Phase 1.
      # Second gate, on top of DEMO_MODE. URL-based passwordless login
      # for the demo instance only. Hard-gated at deploy time; never
      # flippable from the admin UI. Default false — even on a DEMO_MODE
      # deploy, the magic-link surface stays dormant until you set this
      # to true. See docs/plans/demo-magic-link.md.
      SIMPLEVTT_DEMO_MAGIC_LINK_ENABLED: ${SIMPLEVTT_DEMO_MAGIC_LINK_ENABLED:-false}
      # v2.424.0 — fail2ban/CrowdSec integration plan Phase 1.
      # Number of trusted X-Forwarded-For hops behind the app. 0 means
      # never trust the header (default). Set to 1 if exactly one reverse
      # proxy is in front of SimpleVTT and you want audit logs to record
      # the real client IP, not the proxy's. See
      # docs/plans/fail2ban-crowdsec-integration.md for the threat model.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # v2.469.0 — fail2ban Phase 4a. File path for the audit-log
      # RotatingFileHandler tee. The default lands on the shared
      # `audit_logs` named volume mounted below at /var/log/simplevtt,
      # so the fail2ban service (Phase 4b) can tail it without docker-
      # exec'ing into the app container. Set to empty string to
      # disable the file handler (stdout-only).
      AUDIT_LOG_PATH: ${AUDIT_LOG_PATH:-/var/log/simplevtt/audit.log}
      # v2.427.0 — Cloudflare edge-banning Phase 1.
      # Three vars configure the OUTBOUND client; the fourth gates the
      # GM-facing button. CRITICAL: leave all four off in production
      # unless you're actively operating the ban controls. Default base
      # URL is the public Cloudflare API; the dev profile's
      # cloudflare-mock service overrides with a wiremock URL so
      # integration testing works without burning real quota.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_API_BASE_URL: ${CLOUDFLARE_API_BASE_URL:-https://api.cloudflare.com/client/v4}
      SIMPLEVTT_CLOUDFLARE_BANNING_ENABLED: ${SIMPLEVTT_CLOUDFLARE_BANNING_ENABLED:-false}
      # v2.49.12: test-suite knobs (encounter-sim plan, Phase 1).
      # TEST_MODE conditionally mounts /api/test/* endpoints — leave
      # OFF in production. DICE_SEED, when an integer, makes every
      # gameplay roll reproducible. Both default off / unset.
      TEST_MODE: ${TEST_MODE:-false}
      DICE_SEED: ${DICE_SEED:-}
    volumes:
      - uploads_data:/app/app/static/uploads
      - homebrew_data:/app/app/data/homebrew
      # v2.469.0 — fail2ban Phase 4a. Shared volume for the audit-log
      # tee. The fail2ban service in Phase 4b mounts this same volume
      # read-only at the same path to tail the file.
      - audit_logs:/var/log/simplevtt
    ports:
      - "${APP_PORT:-8013}:${APP_PORT:-8013}"

  backup:
    image: postgres:16-alpine  # contains pg_dump, multi-arch
    container_name: simplevtt-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simplevtt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplevtt}
      POSTGRES_DB: ${POSTGRES_DB:-simplevtt}
      PGHOST: db
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}        # daily at 3am UTC
      KEEP_DAILY: ${KEEP_DAILY:-7}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-4}
    volumes:
      - backup_data:/backups
      - homebrew_data:/homebrew:ro
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/entrypoint-backup.sh:/usr/local/bin/entrypoint-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint-backup.sh"]

  # v2.427.0 — wiremock service that fakes Cloudflare's IP Access
  # Rules API for dev + integration tests. Gated behind the ``dev``
  # profile so production stacks don't pull the image; bring up
  # with ``docker compose --profile dev up cloudflare-mock``. The
  # fixtures live under ./docs/integrations/cloudflare/mock/ —
  # canned 200 responses for POST/DELETE/GET on the access_rules
  # endpoint. To use, set in .env:
  #   CLOUDFLARE_API_TOKEN=dev-fake-token
  #   CLOUDFLARE_ZONE_ID=dev-fake-zone
  #   CLOUDFLARE_API_BASE_URL=http://cloudflare-mock:8080/client/v4
  #   SIMPLEVTT_CLOUDFLARE_BANNING_ENABLED=true
  # v2.470.0 — fail2ban Phase 4b. Opt-in fail2ban service.
  # Brings up the crazymax/fail2ban container alongside the app,
  # tailing the shared audit_logs volume (Phase 4a). The container
  # mounts the existing reference filter + jail configs read-only,
  # so the operator gets ban policy out of the box without copying
  # files into /etc/fail2ban/.
  #
  # NOT loaded by default — invoke with:
  #     docker compose --profile fail2ban up -d
  #
  # The default ban action is the image's iptables target. Phase 4d
  # adds a Cloudflare bouncer action template; Phase 4e adds an
  # ipset action template that requires privileged + NET_ADMIN.
  # Both stay opt-in via FAIL2BAN_ACTION (Phase 4d) and a sibling
  # compose override (Phase 4e).
  #
  # Verify the jail loaded after `up`:
  #     docker compose --profile fail2ban exec fail2ban \
  #         fail2ban-client status simplevtt-auth
  fail2ban:
    image: crazymax/fail2ban:1.0.2
    container_name: simplevtt-fail2ban
    profiles:
      - fail2ban
    restart: unless-stopped
    depends_on:
      - app
    environment:
      TZ: ${TZ:-UTC}
      F2B_LOG_LEVEL: ${F2B_LOG_LEVEL:-INFO}
      F2B_LOG_TARGET: STDOUT
      F2B_DB_PURGE_AGE: ${F2B_DB_PURGE_AGE:-1d}
      # v2.471.0 — Phase 4c. Env-driven jail thresholds. The
      # render-jail.sh entrypoint envsubsts these into
      # jail.d/simplevtt.conf at startup.
      FAIL2BAN_AUDIT_LOG_PATH: ${AUDIT_LOG_PATH:-/var/log/simplevtt/audit.log}
      FAIL2BAN_LOGIN_MAXRETRY: ${FAIL2BAN_LOGIN_MAXRETRY:-5}
      FAIL2BAN_LOGIN_FINDTIME: ${FAIL2BAN_LOGIN_FINDTIME:-5m}
      FAIL2BAN_LOGIN_BANTIME: ${FAIL2BAN_LOGIN_BANTIME:-1h}
      FAIL2BAN_MAGIC_LINK_REPLAY_BANTIME: ${FAIL2BAN_MAGIC_LINK_REPLAY_BANTIME:-24h}
      FAIL2BAN_API_PROBE_MAXRETRY: ${FAIL2BAN_API_PROBE_MAXRETRY:-20}
      FAIL2BAN_DEFAULT_BANTIME: ${FAIL2BAN_DEFAULT_BANTIME:-1h}
      # v2.472.0 — Phase 4d. Ban-action selector. Default is the
      # fail2ban built-in iptables/nftables shorthand. Set to
      # `cloudflare-bouncer` (Phase 4d) or `ipset-bouncer` (Phase
      # 4e) to swap. Multiple actions can be space-separated.
      FAIL2BAN_ACTION: ${FAIL2BAN_ACTION:-%(action_)s}
      # v2.472.0 — Phase 4d. CLOUDFLARE_* pass-through so the
      # action.d/cloudflare-bouncer.conf [Init] block can resolve
      # its placeholders via render-jail.sh. Reuses the v2.430.0
      # cloudflare-edge-banning env vars; same token + zone the
      # in-app ban button uses.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_API_BASE_URL: ${CLOUDFLARE_API_BASE_URL:-https://api.cloudflare.com/client/v4}
    # v2.471.0 — Phase 4c. Override the image's entrypoint with the
    # render-jail.sh helper that envsubsts the FAIL2BAN_* placeholders
    # into the jail.d configs before exec'ing the image's standard
    # entrypoint chain.
    #
    # v2.473.1 — Compose's `entrypoint:` override clears the image's
    # default CMD, so we MUST re-supply it as `command:` below or
    # render-jail.sh's `exec /entrypoint.sh "$@"` runs with empty
    # args and the upstream entrypoint exec's nothing → restart loop.
    # The command mirrors the image's Dockerfile CMD.
    entrypoint:
      - /bin/sh
      - /scripts/render-jail.sh
    command:
      - fail2ban-server
      - -f
      - -x
      - -v
      - start
    volumes:
      # Persist the ban database across restarts so a fresh container
      # starts with the existing bans (matches how operators expect
      # fail2ban to behave under systemd).
      - fail2ban_data:/var/lib/fail2ban
      # Read-only tail of the app's audit log volume. Phase 4a owns
      # the writer side; this is the consumer.
      - audit_logs:/var/log/simplevtt:ro
      # Read-only mount of the v2.424.0 reference filter.
      # Operator edits to the on-disk files take effect after
      # `fail2ban-client reload`.
      - ./docs/integrations/fail2ban/filter.d:/etc/fail2ban/filter.d:ro
      # v2.471.0 — Phase 4c. The jail config gets mounted as a
      # template at /etc/fail2ban/jail.d.template/ (read-only);
      # render-jail.sh envsubsts it into the writable
      # /etc/fail2ban/jail.d/ volume at startup. This split lets
      # operator edits to the source template still land (re-render
      # on container restart) while keeping the rendered destination
      # writable so envsubst can drop a file there.
      - ./docs/integrations/fail2ban/jail.d:/etc/fail2ban/jail.d.template:ro
      # v2.472.0 — Phase 4d. Mount action.d/ as a read-only template.
      # render-jail.sh envsubsts its [Init] blocks (Cloudflare token,
      # zone id, base URL) and writes the resolved configs into the
      # container's writable /etc/fail2ban/action.d/, alongside the
      # image's built-in action files (iptables, etc.).
      - ./docs/integrations/fail2ban/action.d:/etc/fail2ban/action.d.template:ro
      - ./docs/integrations/fail2ban/scripts/render-jail.sh:/scripts/render-jail.sh:ro
    # No port mappings — fail2ban-client is reached via
    # `docker compose exec`. Banning runs inside the container via
    # the image's default iptables action (talks to the in-container
    # iptables, not the host's — adequate for the dev profile;
    # production deploys layer Phase 4d (Cloudflare) or 4e (ipset
    # with privileged) on top).

  cloudflare-mock:
    image: wiremock/wiremock:3.10.0
    container_name: simplevtt-cloudflare-mock
    profiles:
      - dev
    ports:
      - "8014:8080"
    volumes:
      - ./docs/integrations/cloudflare/mock:/home/wiremock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  backup_data:
  db_data:
  uploads_data:
  homebrew_data:
  # v2.469.0 — fail2ban Phase 4a. Shared between the app container
  # (writes audit.log via RotatingFileHandler) and the fail2ban
  # container in Phase 4b (read-only tail).
  audit_logs:
  # v2.470.0 — fail2ban Phase 4b. Ban-database persistence so the
  # fail2ban container starts with the existing bans across
  # restarts. Empty for the default `docker compose up` flow since
  # the fail2ban service is profile-gated.
  fail2ban_data:
