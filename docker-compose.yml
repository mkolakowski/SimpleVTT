# SimpleVTT — docker compose stack
# All images chosen are multi-arch (linux/amd64 + linux/arm64).
# All configuration comes from .env (see .env.example).
#
# CONVENTION: third-party APIs are added here as named services so they stay
# on the internal Docker network and never depend on internet availability at
# request time. See CLAUDE.md for the full rule.
services:
  # ── Database ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: simplevtt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simplevtt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplevtt}
      POSTGRES_DB: ${POSTGRES_DB:-simplevtt}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simplevtt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: simplevtt-app:latest
    container_name: simplevtt-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-simplevtt}:${POSTGRES_PASSWORD:-simplevtt}@db:5432/${POSTGRES_DB:-simplevtt}
      APP_PORT: ${APP_PORT:-8013}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8013}
      APP_ALLOW_LOCAL_REGISTRATION: ${APP_ALLOW_LOCAL_REGISTRATION:-true}
      ADMINS: ${ADMINS:-}
      CHARACTER_TEMPLATES: ${CHARACTER_TEMPLATES:-generic,dnd5e}
      APP_DEFAULT_THEME: ${APP_DEFAULT_THEME:-sepia}
      GOOGLE_SSO_ENABLED: ${GOOGLE_SSO_ENABLED:-false}
      GOOGLE_SSO_CLIENT_ID: ${GOOGLE_SSO_CLIENT_ID:-}
      GOOGLE_SSO_CLIENT_SECRET: ${GOOGLE_SSO_CLIENT_SECRET:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_RESET_INTERVAL_MINUTES: ${DEMO_RESET_INTERVAL_MINUTES:-60}
      DEMO_RESET_ON_BOOT: ${DEMO_RESET_ON_BOOT:-true}
      DEMO_CREDENTIALS_VISIBLE: ${DEMO_CREDENTIALS_VISIBLE:-true}
      # v2.776.0 — version-stamp display toggles.
      SHOW_VERSION: ${SHOW_VERSION:-true}
      VERSION_LINK_CHANGELOG: ${VERSION_LINK_CHANGELOG:-true}
      SHOW_VERSION_NAME: ${SHOW_VERSION_NAME:-true}
      # v2.495.0 — whether the demo GM (demo-gm@example.com) is granted
      # SITE-admin (the /admin portal: user management, audit-log
      # scrub, ban controls) — distinct from its per-campaign GM role.
      # Default true for local/CI so the admin showcase + admin-portal
      # harness tests work. SET TO false ON ANY PUBLIC/INTERNET-FACING
      # demo deploy: the demo password is advertised on the login page,
      # so a site-admin demo GM is an open admin backdoor.
      DEMO_GM_SITE_ADMIN: ${DEMO_GM_SITE_ADMIN:-true}
      # v2.425.0 — demo magic-link login plan Phase 1.
      # Second gate, on top of DEMO_MODE. URL-based passwordless login
      # for the demo instance only. Hard-gated at deploy time; never
      # flippable from the admin UI. Default false — even on a DEMO_MODE
      # deploy, the magic-link surface stays dormant until you set this
      # to true. See docs/plans/demo-magic-link.md.
      SIMPLEVTT_DEMO_MAGIC_LINK_ENABLED: ${SIMPLEVTT_DEMO_MAGIC_LINK_ENABLED:-false}
      # v2.424.0 — fail2ban/CrowdSec integration plan Phase 1.
      # Number of trusted X-Forwarded-For hops behind the app. 0 means
      # never trust the header (default). Set to 1 if exactly one reverse
      # proxy is in front of SimpleVTT and you want audit logs to record
      # the real client IP, not the proxy's. See
      # docs/plans/fail2ban-crowdsec-integration.md for the threat model.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # v2.488.0 — trust Cloudflare's CF-Connecting-IP header for the
      # real visitor IP. Enable ONLY when the origin is reachable only
      # via Cloudflare (e.g. a Cloudflare Tunnel) — otherwise an
      # attacker hitting the origin directly could spoof their IP.
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-false}
      # v2.599.2 — opt-in per-request visitor logging (app/visitor_log.py).
      # Was wired in code + .env.example but never plumbed here, so it
      # silently never fired. Default off (high-volume + privacy-sensitive);
      # the gate also needs a trustworthy IP source (a trusted XFF hop OR
      # TRUST_CF_CONNECTING_IP). See docs/wiki/privacy.md.
      VISITOR_REQUEST_LOG_ENABLED: ${VISITOR_REQUEST_LOG_ENABLED:-false}
      # v2.599.7 — set the Secure flag on the session cookie. Default off so
      # HTTP dev / the localhost harness still authenticate; set true on an
      # HTTPS-only deployment so the cookie is never sent over plaintext.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # v2.469.0 — fail2ban Phase 4a. File path for the audit-log
      # RotatingFileHandler tee. The default lands on the shared
      # `audit_logs` named volume mounted below at /var/log/simplevtt,
      # so the fail2ban service (Phase 4b) can tail it without docker-
      # exec'ing into the app container. Set to empty string to
      # disable the file handler (stdout-only).
      AUDIT_LOG_PATH: ${AUDIT_LOG_PATH:-/var/log/simplevtt/audit.log}
      # v2.427.0 — Cloudflare edge-banning Phase 1.
      # Three vars configure the OUTBOUND client; the fourth gates the
      # GM-facing button. CRITICAL: leave all four off in production
      # unless you're actively operating the ban controls. Default base
      # URL is the public Cloudflare API; the dev profile's
      # cloudflare-mock service overrides with a wiremock URL so
      # integration testing works without burning real quota.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_API_BASE_URL: ${CLOUDFLARE_API_BASE_URL:-https://api.cloudflare.com/client/v4}
      SIMPLEVTT_CLOUDFLARE_BANNING_ENABLED: ${SIMPLEVTT_CLOUDFLARE_BANNING_ENABLED:-false}
      # v2.531.1 — deploy-time edge-cache purge (purge Cloudflare's cache
      # on boot so a new APP_VERSION isn't served stale). Default false.
      SIMPLEVTT_CLOUDFLARE_CACHE_PURGE_ENABLED: ${SIMPLEVTT_CLOUDFLARE_CACHE_PURGE_ENABLED:-false}
      # v2.724.0 — Discord webhook for in-app notifications (new
      # suggestion / issue reports). Reuses the SAME webhook the fail2ban
      # discord-notify action uses (FAIL2BAN_DISCORD_WEBHOOK_URL), so one
      # channel receives both ban alerts and feedback pings. Empty URL →
      # the app posts nothing (graceful no-op). FAIL2BAN_DISCORD_USERNAME
      # (default "SimpleVTT fail2ban") is reused as the display name.
      FAIL2BAN_DISCORD_WEBHOOK_URL: ${FAIL2BAN_DISCORD_WEBHOOK_URL:-}
      FAIL2BAN_DISCORD_USERNAME: ${FAIL2BAN_DISCORD_USERNAME:-SimpleVTT fail2ban}
      # v2.49.12: test-suite knobs (encounter-sim plan, Phase 1).
      # TEST_MODE conditionally mounts /api/test/* endpoints — leave
      # OFF in production. DICE_SEED, when an integer, makes every
      # gameplay roll reproducible. Both default off / unset.
      TEST_MODE: ${TEST_MODE:-false}
      DICE_SEED: ${DICE_SEED:-}
    volumes:
      - uploads_data:/app/app/static/uploads
      - homebrew_data:/app/app/data/homebrew
      # v2.469.0 — fail2ban Phase 4a. Shared volume for the audit-log
      # tee. The fail2ban service in Phase 4b mounts this same volume
      # read-only at the same path to tail the file.
      - audit_logs:/var/log/simplevtt
    ports:
      - "${APP_PORT:-8013}:${APP_PORT:-8013}"

  # ── Admin Center ────────────────────────────────────────────────────────────
  # v2.483.0 — standalone read-only operator dashboard on its own port
  # (default 8015). Reuses the app image but launches
  # app.admin_center.main:app. Mounts the audit_logs volume read-only
  # to parse the canonical audit log into traffic stats + an event
  # viewer. Protected by HTTP basic-auth (ADMIN_CENTER_USER /
  # ADMIN_CENTER_PASS) independent of the main app's session login.
  # On by default; set ADMIN_CENTER_PASS in .env before exposing
  # off-host (the dashboard nags while the default password is in use).
  admin-center:
    build: .
    image: simplevtt-app:latest
    container_name: simplevtt-admin-center
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # v2.972.0 — the demo self-test drives the app over HTTP+WS, so the
      # app service should be up first (service_started; the app has no
      # healthcheck). The runner still degrades gracefully if it's down.
      app:
        condition: service_started
    environment:
      # v2.485.0 — read-only DB access for the data-inventory panel
      # (row counts). Same connection string as the app service.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-simplevtt}:${POSTGRES_PASSWORD:-simplevtt}@db:5432/${POSTGRES_DB:-simplevtt}
      AUDIT_LOG_PATH: ${AUDIT_LOG_PATH:-/var/log/simplevtt/audit.log}
      # v2.573.0 — where the /tests dashboard reads harness JSON reports.
      TEST_RESULTS_DIR: ${TEST_RESULTS_DIR:-/data/test-results}
      # v2.573.2 — Admin tools (Phase 1, admin-center-consolidation.md):
      # opt-in operator tools (demo reset + magic-link mint). Default off so
      # the Center stays read-only unless explicitly enabled. The demo flags
      # + base URL mirror the app service so the moved tools behave the same.
      ADMIN_CENTER_ADMIN_TOOLS: ${ADMIN_CENTER_ADMIN_TOOLS:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      # v2.629.0 — testing override so the /backups page is fully functional
      # (settings / run / restore) even on a demo instance. Default false.
      DEMO_BACKUPS_ENABLED: ${DEMO_BACKUPS_ENABLED:-false}
      SIMPLEVTT_DEMO_MAGIC_LINK_ENABLED: ${SIMPLEVTT_DEMO_MAGIC_LINK_ENABLED:-false}
      # v2.598.0 — the Center's demo-reset button runs the SAME reset_and_reseed
      # as the app, so it needs the same DEMO_GM_SITE_ADMIN value or an
      # operator reset would seed the demo GM as site-admin (default true)
      # even when the deploy set it false — silently granting the well-known
      # demo credentials the /admin portal on a public box.
      DEMO_GM_SITE_ADMIN: ${DEMO_GM_SITE_ADMIN:-true}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8013}
      # v2.972.0 — where the demo self-test (/selftest) drives the main app
      # over HTTP+WS. From inside this container the app is the `app` service,
      # not localhost (which is the admin-center itself). Compose sets it
      # automatically; a localhost fallback keeps the runner usable in dev.
      SELFTEST_APP_URL: ${SELFTEST_APP_URL:-http://app:8013}
      # v2.977.0 — where completed self-test runs are archived for the
      # history table (a dedicated admin-center-owned volume, mounted below).
      SELFTEST_RESULTS_DIR: ${SELFTEST_RESULTS_DIR:-/data/selftest-results}
      # v2.986.0 — capture resolution ("WxH") for the self-test video recorder.
      # Default 900p (1600x900); set 1920x1080 for 1080p.
      SELFTEST_VIDEO_SIZE: ${SELFTEST_VIDEO_SIZE:-1600x900}
      ADMIN_CENTER_USER: ${ADMIN_CENTER_USER:-admin}
      ADMIN_CENTER_PASS: ${ADMIN_CENTER_PASS:-changeme}
      ADMIN_CENTER_PORT: ${ADMIN_CENTER_PORT:-8015}
      # v2.487.2 — timezone the dashboard renders times in (audit-log
      # line timestamps + fail2ban ban times). Default US Eastern
      # (DST-aware). Display-only; doesn't change what the app logs.
      ADMIN_CENTER_TZ: ${ADMIN_CENTER_TZ:-America/New_York}
      # v2.488.0 — same proxy/Cloudflare IP-attribution knobs as the
      # app, so the login brute-force throttle keys on the real client
      # IP behind a tunnel rather than the Cloudflare/proxy address.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-false}
      # v2.599.7 — Secure flag on the admin-center session cookie (see app).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # v2.485.3 — secret for the login-page session cookie. Falls back
      # to APP_SECRET_KEY, then a dev default, inside the app.
      ADMIN_CENTER_SECRET_KEY: ${ADMIN_CENTER_SECRET_KEY:-}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      # v2.485.4 — login brute-force throttle: lock an IP out after N
      # failed sign-ins within the window (seconds).
      ADMIN_CENTER_LOGIN_MAX_ATTEMPTS: ${ADMIN_CENTER_LOGIN_MAX_ATTEMPTS:-5}
      ADMIN_CENTER_LOGIN_WINDOW_SECONDS: ${ADMIN_CENTER_LOGIN_WINDOW_SECONDS:-900}
      # v2.486.1 — opt-in TOTP MFA on the admin-center login. Default
      # off. When ENABLED, a TOTP_SECRET is required or the login fails
      # closed. RECOVERY_CODE is blank by default → no recovery code is
      # accepted unless one is set. See docs/plans/admin-center-mfa.md.
      ADMIN_CENTER_MFA_ENABLED: ${ADMIN_CENTER_MFA_ENABLED:-false}
      ADMIN_CENTER_TOTP_SECRET: ${ADMIN_CENTER_TOTP_SECRET:-}
      ADMIN_CENTER_RECOVERY_CODE: ${ADMIN_CENTER_RECOVERY_CODE:-}
      # v2.484.0 — path to fail2ban's sqlite ban db (read-only mount
      # below). When the --profile fail2ban service isn't running the
      # shared volume is empty and the dashboard shows an empty state.
      FAIL2BAN_DB_PATH: ${FAIL2BAN_DB_PATH:-/data/db/fail2ban.sqlite3}
      # v2.485.7 — shared spool the "Unban" button writes unban
      # requests into; the fail2ban watcher drains it.
      FAIL2BAN_CONTROL_DIR: ${FAIL2BAN_CONTROL_DIR:-/data/control}
      # v2.488.1 — Cloudflare client config so the "Unban" button can
      # also remove the edge IP Access Rule. Same vars the app uses.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_API_BASE_URL: ${CLOUDFLARE_API_BASE_URL:-https://api.cloudflare.com/client/v4}
    volumes:
      # Consumer of the app's audit-log volume. Read-WRITE (v2.488.2)
      # only so the "Clear log" button can truncate the log; the admin
      # center never appends events (the app owns that), just clears.
      # The file is appuser-owned and admin-center runs as appuser, so
      # the truncate works without root.
      - audit_logs:/var/log/simplevtt
      # Read-only consumer of fail2ban's ban database (same named
      # volume the fail2ban service writes at /data/db).
      - fail2ban_data:/data/db:ro
      # v2.485.7 — write side of the unban control spool drained by the
      # fail2ban watcher. Read-write here; the admin center only ever
      # writes small request files (no fail2ban control-socket access).
      - fail2ban_control:/data/control
      # v2.573.0 — read-only harness test-results (JSON reports from
      # scripts/run_harness.sh) for the /tests dashboard. Bind-mounted
      # from the repo; empty/absent in production where the suite isn't
      # run (the page shows an empty-state).
      - ./test-results:/data/test-results:ro
      # v2.582.0 — read-WRITE share of the app's uploads volume so the
      # Admin Center's campaign-management surface (Phase 3b) can write
      # map / thumbnail files the APP serves at /static/uploads/...
      # (the Center has no /static mount of its own). Same path the app
      # mounts it at, so the in-image UPLOAD_ROOT resolves identically.
      - uploads_data:/app/app/static/uploads
      # v2.620.0 — read-WRITE share of the backup sidecar's volume so the
      # Admin Center's /backups page can edit the schedule/retention
      # (writes backup-settings.json the sidecar watch-loops) + list the
      # backup artifacts + drop a "run now" trigger file. Same path the
      # sidecar mounts it at (/backups).
      - backup_data:/backups
      # v2.977.0 — admin-center-owned store for demo self-test run history.
      - selftest_results:/data/selftest-results
    ports:
      - "${ADMIN_CENTER_PORT:-8015}:${ADMIN_CENTER_PORT:-8015}"
    command:
      - sh
      - -c
      - uvicorn app.admin_center.main:app --host 0.0.0.0 --port "${ADMIN_CENTER_PORT:-8015}" --proxy-headers
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,os; urllib.request.urlopen('http://localhost:'+os.environ.get('ADMIN_CENTER_PORT','8015')+'/healthz').read()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  backup:
    # v2.998.0 — custom image: postgres:16-alpine (pg_dump, multi-arch) plus
    # rclone for offsite uploads (S3 / Google Drive / Dropbox / OneDrive).
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: simplevtt-backup:latest
    container_name: simplevtt-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simplevtt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplevtt}
      POSTGRES_DB: ${POSTGRES_DB:-simplevtt}
      PGHOST: db
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}        # daily at 3am UTC (initial; overridden by /backups settings file)
      KEEP_DAILY: ${KEEP_DAILY:-7}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-4}
      # v2.620.0 — when true the sidecar takes NO automated backups (the
      # demo DB reseeds hourly, so scheduled dumps are pure churn). The
      # Admin Center /backups page shows "Disabled — demo mode".
      DEMO_MODE: ${DEMO_MODE:-false}
      # v2.629.0 — testing override: re-enable backups even on a demo
      # instance so the backup/restore flow can be exercised. Default false.
      DEMO_BACKUPS_ENABLED: ${DEMO_BACKUPS_ENABLED:-false}
    volumes:
      - backup_data:/backups
      # v2.626.0 — capture the homebrew + uploaded-media volumes too (a backup
      # run tars them). v2.627.0 — read-WRITE so the operator restore flow can
      # unpack them back into place (clear + untar). Same paths the app uses.
      - homebrew_data:/homebrew
      - uploads_data:/uploads
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/entrypoint-backup.sh:/usr/local/bin/entrypoint-backup.sh:ro
      # v2.998.0 — offsite upload helpers (sourced by both scripts above).
      - ./scripts/offsite.sh:/usr/local/bin/offsite.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint-backup.sh"]

  # v2.998.0 — local S3-compatible target (MinIO) for developing + verifying
  # the offsite-backup upload end-to-end without touching a real cloud account
  # (per the third-party-APIs-as-compose-services rule). Dev-profile-gated:
  # bring up with ``docker compose --profile dev up -d minio``. Point the
  # Admin Center's offsite S3 form at endpoint http://minio:9000 with the
  # minioadmin credentials below.
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: simplevtt-minio
    profiles:
      - dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # v2.427.0 — wiremock service that fakes Cloudflare's IP Access
  # Rules API for dev + integration tests. Gated behind the ``dev``
  # profile so production stacks don't pull the image; bring up
  # with ``docker compose --profile dev up cloudflare-mock``. The
  # fixtures live under ./docs/integrations/cloudflare/mock/ —
  # canned 200 responses for POST/DELETE/GET on the access_rules
  # endpoint. To use, set in .env:
  #   CLOUDFLARE_API_TOKEN=dev-fake-token
  #   CLOUDFLARE_ZONE_ID=dev-fake-zone
  #   CLOUDFLARE_API_BASE_URL=http://cloudflare-mock:8080/client/v4
  #   SIMPLEVTT_CLOUDFLARE_BANNING_ENABLED=true
  # v2.470.0 — fail2ban Phase 4b. Opt-in fail2ban service.
  # Brings up the crazymax/fail2ban container alongside the app,
  # tailing the shared audit_logs volume (Phase 4a). The container
  # mounts the existing reference filter + jail configs read-only,
  # so the operator gets ban policy out of the box without copying
  # files into /etc/fail2ban/.
  #
  # NOT loaded by default — invoke with:
  #     docker compose --profile fail2ban up -d
  #
  # The default ban action is the image's iptables target. Phase 4d
  # adds a Cloudflare bouncer action template; Phase 4e adds an
  # ipset action template that requires privileged + NET_ADMIN.
  # Both stay opt-in via FAIL2BAN_ACTION (Phase 4d) and a sibling
  # compose override (Phase 4e).
  #
  # Verify the jail loaded after `up`:
  #     docker compose --profile fail2ban exec fail2ban \
  #         fail2ban-client status simplevtt-auth
  fail2ban:
    image: crazymax/fail2ban:1.0.2
    container_name: simplevtt-fail2ban
    profiles:
      - fail2ban
    restart: unless-stopped
    depends_on:
      - app
    environment:
      TZ: ${TZ:-UTC}
      F2B_LOG_LEVEL: ${F2B_LOG_LEVEL:-INFO}
      F2B_LOG_TARGET: STDOUT
      F2B_DB_PURGE_AGE: ${F2B_DB_PURGE_AGE:-1d}
      # v2.471.0 — Phase 4c. Env-driven jail thresholds. The
      # render-jail.sh entrypoint envsubsts these into
      # jail.d/simplevtt.conf at startup.
      FAIL2BAN_AUDIT_LOG_PATH: ${AUDIT_LOG_PATH:-/var/log/simplevtt/audit.log}
      FAIL2BAN_LOGIN_MAXRETRY: ${FAIL2BAN_LOGIN_MAXRETRY:-5}
      FAIL2BAN_LOGIN_FINDTIME: ${FAIL2BAN_LOGIN_FINDTIME:-5m}
      FAIL2BAN_LOGIN_BANTIME: ${FAIL2BAN_LOGIN_BANTIME:-1h}
      FAIL2BAN_MAGIC_LINK_REPLAY_BANTIME: ${FAIL2BAN_MAGIC_LINK_REPLAY_BANTIME:-24h}
      FAIL2BAN_API_PROBE_MAXRETRY: ${FAIL2BAN_API_PROBE_MAXRETRY:-20}
      FAIL2BAN_DEFAULT_BANTIME: ${FAIL2BAN_DEFAULT_BANTIME:-1h}
      # v2.477.0 — Phase 5. Scanner-detection jail thresholds.
      # Catches IPs that probe many missing paths in a short
      # window (vulnerability scanners hitting /.env, /wp-admin,
      # /phpinfo.php, etc.). Defaults: 20 distinct 404s in 5min
      # → 6h ban. The threshold is high enough to swallow normal
      # browser noise from stale bookmarks; tight enough to catch
      # any real scanner pump.
      FAIL2BAN_SCANNER_MAXRETRY: ${FAIL2BAN_SCANNER_MAXRETRY:-10}
      FAIL2BAN_SCANNER_FINDTIME: ${FAIL2BAN_SCANNER_FINDTIME:-5m}
      FAIL2BAN_SCANNER_BANTIME: ${FAIL2BAN_SCANNER_BANTIME:-6h}
      # v2.481.0 — request-flood jail thresholds. Matches the opt-in
      # ``visitor.request`` event (app/visitor_log.py, v2.480.0) and
      # bans IPs that hammer the app regardless of outcome. Gated OFF
      # by default — the jail only makes sense when per-request
      # logging is also on, so both opt-ins travel together. Defaults
      # (when enabled): 300 requests in 1min → 1h ban.
      FAIL2BAN_FLOOD_ENABLED: ${FAIL2BAN_FLOOD_ENABLED:-false}
      FAIL2BAN_FLOOD_MAXRETRY: ${FAIL2BAN_FLOOD_MAXRETRY:-300}
      FAIL2BAN_FLOOD_FINDTIME: ${FAIL2BAN_FLOOD_FINDTIME:-1m}
      FAIL2BAN_FLOOD_BANTIME: ${FAIL2BAN_FLOOD_BANTIME:-1h}
      # v2.495.4 — allowlist appended to the jails' [DEFAULT] ignoreip
      # (localhost is always kept). Space-separated IPs/CIDRs that
      # should NEVER be banned — e.g. a trusted smoke-test / monitoring
      # host that runs the harness against the public deploy and would
      # otherwise self-ban on its own error-path 401/403/404 tests.
      # Empty by default. CAUTION: an allowlisted IP is exempt from ALL
      # jails — don't list a shared/NAT/Cloudflare-egress address unless
      # everything behind it can also be trusted.
      FAIL2BAN_IGNOREIP: ${FAIL2BAN_IGNOREIP:-}
      # v2.472.0 — Phase 4d. Ban-action selector. Default is the
      # fail2ban built-in iptables/nftables shorthand. Set to
      # `cloudflare-bouncer` (Phase 4d) or `ipset-bouncer` (Phase
      # 4e) to swap. Multiple actions can be space-separated.
      FAIL2BAN_ACTION: ${FAIL2BAN_ACTION:-%(action_)s}
      # v2.472.0 — Phase 4d. CLOUDFLARE_* pass-through so the
      # action.d/cloudflare-bouncer.conf [Init] block can resolve
      # its placeholders via render-jail.sh. Reuses the v2.430.0
      # cloudflare-edge-banning env vars; same token + zone the
      # in-app ban button uses.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_API_BASE_URL: ${CLOUDFLARE_API_BASE_URL:-https://api.cloudflare.com/client/v4}
      # v2.566.0 — optional Discord webhook notifications. The
      # action.d/discord-notify.conf [Init] block resolves these via
      # render-jail.sh. Empty webhook URL → the action no-ops. Opt in
      # by adding `discord-notify` to FAIL2BAN_ACTION (space-separated).
      FAIL2BAN_DISCORD_WEBHOOK_URL: ${FAIL2BAN_DISCORD_WEBHOOK_URL:-}
      FAIL2BAN_DISCORD_USERNAME: ${FAIL2BAN_DISCORD_USERNAME:-SimpleVTT fail2ban}
    # v2.471.0 — Phase 4c. Override the image's entrypoint with the
    # render-jail.sh helper that envsubsts the FAIL2BAN_* placeholders
    # into the jail.d configs before exec'ing the image's standard
    # entrypoint chain.
    #
    # v2.473.1 — Compose's `entrypoint:` override clears the image's
    # default CMD, so we MUST re-supply it as `command:` below or
    # render-jail.sh's `exec /entrypoint.sh "$@"` runs with empty
    # args and the upstream entrypoint exec's nothing → restart loop.
    # The command mirrors the image's Dockerfile CMD.
    entrypoint:
      - /bin/sh
      - /scripts/render-jail.sh
    command:
      - fail2ban-server
      - -f
      - -x
      - -v
      - start
    volumes:
      # Persist the ban database across restarts so a fresh container
      # starts with the existing bans (matches how operators expect
      # fail2ban to behave under systemd). v2.484.0 — the crazymax
      # image's dbfile is /data/db/fail2ban.sqlite3 (NOT the upstream
      # default /var/lib/fail2ban), so the volume must mount there to
      # actually persist + to let the admin-center service read it
      # read-only.
      - fail2ban_data:/data/db
      # Read-only tail of the app's audit log volume. Phase 4a owns
      # the writer side; this is the consumer.
      - audit_logs:/var/log/simplevtt:ro
      # Read-only mount of the v2.424.0 reference filter.
      # Operator edits to the on-disk files take effect after
      # `fail2ban-client reload`.
      - ./docs/integrations/fail2ban/filter.d:/etc/fail2ban/filter.d:ro
      # v2.471.0 — Phase 4c. The jail config gets mounted as a
      # template at /etc/fail2ban/jail.d.template/ (read-only);
      # render-jail.sh envsubsts it into the writable
      # /etc/fail2ban/jail.d/ volume at startup. This split lets
      # operator edits to the source template still land (re-render
      # on container restart) while keeping the rendered destination
      # writable so envsubst can drop a file there.
      - ./docs/integrations/fail2ban/jail.d:/etc/fail2ban/jail.d.template:ro
      # v2.472.0 — Phase 4d. Mount action.d/ as a read-only template.
      # render-jail.sh envsubsts its [Init] blocks (Cloudflare token,
      # zone id, base URL) and writes the resolved configs into the
      # container's writable /etc/fail2ban/action.d/, alongside the
      # image's built-in action files (iptables, etc.).
      - ./docs/integrations/fail2ban/action.d:/etc/fail2ban/action.d.template:ro
      - ./docs/integrations/fail2ban/scripts/render-jail.sh:/scripts/render-jail.sh:ro
      # v2.485.7 — unban-request watcher + the shared control spool the
      # admin-center "Unban" button writes to. The watcher (root, here)
      # drains it via fail2ban-client so admin-center stays non-root.
      - ./docs/integrations/fail2ban/scripts/unban-watcher.sh:/scripts/unban-watcher.sh:ro
      - fail2ban_control:/data/control
    # No port mappings — fail2ban-client is reached via
    # `docker compose exec`. Banning runs inside the container via
    # the image's default iptables action (talks to the in-container
    # iptables, not the host's — adequate for the dev profile;
    # production deploys layer Phase 4d (Cloudflare) or 4e (ipset
    # with privileged) on top).

  cloudflare-mock:
    image: wiremock/wiremock:3.10.0
    container_name: simplevtt-cloudflare-mock
    profiles:
      - dev
    ports:
      - "8014:8080"
    volumes:
      - ./docs/integrations/cloudflare/mock:/home/wiremock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  backup_data:
  db_data:
  uploads_data:
  homebrew_data:
  # v2.469.0 — fail2ban Phase 4a. Shared between the app container
  # (writes audit.log via RotatingFileHandler) and the fail2ban
  # container in Phase 4b (read-only tail).
  audit_logs:
  # v2.470.0 — fail2ban Phase 4b. Ban-database persistence so the
  # fail2ban container starts with the existing bans across
  # restarts. Empty for the default `docker compose up` flow since
  # the fail2ban service is profile-gated.
  fail2ban_data:
  # v2.485.7 — unban control spool shared between admin-center (writer,
  # non-root) and fail2ban (watcher, root). Small request files only.
  fail2ban_control:
  # v2.977.0 — admin-center demo self-test run history (archived JSON
  # reports the /selftest page lists + reopens). Owned by admin-center.
  selftest_results:
  # v2.998.0 — MinIO object store for the dev-profile offsite-backup target.
  minio_data:
